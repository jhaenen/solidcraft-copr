# Daily: bump solidcraft.spec when upstream publishes a new release (the push triggers a COPR
# rebuild through its GitHub webhook), and fail loudly if the latest COPR build failed, so
# GitHub emails about it.
name: Update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM: tangency-labs/solidcraft
  COPR_PROJECT: blackhawk/SolidCraft
  COPR_PACKAGE: solidcraft

jobs:
  update:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf -y install git rpm-build rpmdevtools gh jq

      - uses: actions/checkout@v4

      - name: Bump spec to the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          latest=$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)
          latest=${latest#v}
          current=$(rpmspec -q --srpm --qf '%{version}' solidcraft.spec)
          echo "upstream $latest, spec $current"
          if [ "$latest" = "$current" ]; then
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "upstream $latest is older than spec $current; leaving the spec alone"
            exit 0
          fi
          rpmdev-bumpspec -n "$latest" -c "Update to $latest" \
            -u "SolidCraft COPR bot <jasper@haenenweb.nl>" solidcraft.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to $latest"
          git push

      - name: Fail if the latest COPR build failed
        run: |
          owner=${COPR_PROJECT%/*}; project=${COPR_PROJECT#*/}
          build=$(curl -sf "https://copr.fedorainfracloud.org/api_3/package?ownername=$owner&projectname=$project&packagename=$COPR_PACKAGE&with_latest_build=true" \
            | jq '.builds.latest')
          id=$(jq -r .id <<<"$build"); state=$(jq -r .state <<<"$build")
          echo "latest COPR build $id: $state"
          if [ "$state" = failed ]; then
            echo "::error::COPR build $id failed: https://copr.fedorainfracloud.org/coprs/build/$id"
            exit 1
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity;
      # re-enabling it from here resets that timer.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml -R "$GITHUB_REPOSITORY"
